[package]
name = "cheese-corner-pos"
version = "1.0.0"
description = "Cheese Corner Native Windows Counter POS Station"
authors = ["Cheese Corner Systems Engineering"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Graphics_Printing",
    "Win32_Foundation",
] }
